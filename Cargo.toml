[package]
name = "rustclamp-kernel"
version = "1.0.0"
edition = "2024"
rust-version = "1.96.1"
description = "Composition and capability resolution for RustClamp applications."
repository = "https://github.com/rustclamp/kernel"
license = "MIT OR Apache-2.0"
homepage = "https://rustclamp.com"
documentation = "https://docs.rs/rustclamp-kernel"
keywords = ["framework", "composition", "dependency-injection"]
categories = ["rust-patterns"]
readme = "README.md"

[dependencies]
rustclamp-core = { version = "1.0.0", path = "../core" }

[[bench]]
name = "resolution"
harness = false

[[bench]]
name = "process_projection"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
