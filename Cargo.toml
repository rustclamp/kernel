[package]
name = "rustclamp-kernel"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
description = "Clamp composition and resolution, introduced by the capability prototype."
repository = "https://github.com/rustclamp/kernel"
license = "MIT OR Apache-2.0"
readme = "README.md"
publish = false

[dependencies]
rustclamp-core = { version = "0.1.0", path = "../core" }

[[bench]]
name = "resolution"
harness = false

[[bench]]
name = "process_projection"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
